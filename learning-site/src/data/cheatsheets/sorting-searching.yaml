    items:
      - term: 'Insertion point from `BinarySearch`'
        code: |
          int idx = Array.BinarySearch(arr, 7);
          if (idx < 0)
          {
              int insertPos = ~idx;   // bitwise complement gives where it WOULD be inserted
          }
        lang: csharp
        from: { lesson: search-built-ins-and-summary, section: 'Built-in C# Search Methods' }

  - title: Binary search templates
    items:
      - term: 'Classic binary search'
        desc: 'Use `left + (right - left) / 2`: `left + right` can overflow `int`. Iterative is O(1) space, recursive O(log n).'
        code: |
          int BinarySearch(int[] arr, int target)
          {
              int left = 0, right = arr.Length - 1;
              while (left <= right)
              {
                  int mid = left + (right - left) / 2;   // avoids int overflow
                  if (arr[mid] == target) return mid;
                  if (arr[mid] < target) left = mid + 1;
                  else right = mid - 1;
              }
              return -1;
          }
        lang: csharp
        from: { lesson: linear-and-binary-search, section: '2. Binary Search' }
      - term: 'Lower bound'
        desc: 'First index where `arr[i] >= target`. Upper bound is the same with `arr[mid] <= target`, giving the first index where `arr[i] > target`.'
        code: |
          int LowerBound(int[] arr, int target)
          {
              int left = 0, right = arr.Length;      // right = Length (exclusive)
              while (left < right)
              {
                  int mid = left + (right - left) / 2;
                  if (arr[mid] < target) left = mid + 1;
                  else right = mid;
              }
              return left;
          }
        lang: csharp
        from: { lesson: linear-and-binary-search, section: '3. Lower Bound / Upper Bound (Binary Search Variants)' }
      - term: 'Binary search on the answer'
        desc: 'When the condition is monotonic (false…false, true…true), search the answer range. Cost: O(log(range) × cost of `IsFeasible`). Cast to `long` before `mid * mid`-style products.'
        code: |
          int lo = minPossible, hi = maxPossible;
          while (lo < hi)
          {
              int mid = lo + (hi - lo) / 2;
              if (IsFeasible(mid)) hi = mid;      // try smaller
              else lo = mid + 1;                  // need bigger
          }
          return lo;
        lang: csharp
        from: { lesson: more-array-searches, section: '4. Binary Search on Answer (Very Common in LeetCode)' }
    table:
      columns: [Want, Formula]
      from: { lesson: linear-and-binary-search, section: '3. Lower Bound / Upper Bound (Binary Search Variants)' }
      rows:
        - ['First occurrence', '`LowerBound(target)`, valid if `arr[lower] == target`']
        - ['Last occurrence', '`UpperBound(target) - 1`']
        - ['Count of target', '`UpperBound(target) - LowerBound(target)`']
        - ['Insertion position', '`LowerBound(target)`']

  - title: BFS vs DFS
    table:
      columns: [Need, Use]
      from: { lesson: hash-bfs-dfs, section: 'Depth-First Search (DFS)' }
      rows:
        - ['Shortest path (unweighted)', 'BFS (`Queue<T>`, level by level)']
        - ['Explore all possibilities / backtracking', 'DFS (recursion or `Stack<T>`)']
        - ['Very deep graph (stack overflow risk)', 'BFS or iterative DFS']
        - ['Very wide graph (memory-heavy queue)', 'DFS']
    items:
      - term: 'BFS with a visited set'
        desc: '`HashSet.Add` returns `false` if the node was already seen, so it marks and tests in one call.'
        code: |
          var queue = new Queue<(int node, int dist)>();
          var visited = new HashSet<int> { start };
          queue.Enqueue((start, 0));

          while (queue.Count > 0)
          {
              var (node, dist) = queue.Dequeue();
              if (node == target) return dist;

              foreach (int next in graph.GetValueOrDefault(node, new List<int>()))
                  if (visited.Add(next))               // Add returns false if already present
                      queue.Enqueue((next, dist + 1));
          }
          return -1;
        lang: csharp
        from: { lesson: hash-bfs-dfs, section: 'Breadth-First Search (BFS)' }
