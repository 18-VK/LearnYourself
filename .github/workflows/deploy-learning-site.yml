# Builds the LearnYourself site from the notes and deploys it to GitHub Pages.
# - Pull requests: install, content pipeline, unit tests, C# runner (tests, bundle, runnable-block check), build (with
#   coverage + link + budget checks), smoke tests. No deploy.
# - Pushes to main (and manual runs): the same, then deploy to https://18-vk.github.io/LearnYourself/
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy learning site

on:
  push:
    branches: [main]
    paths:
      - "learning-site/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.PNG"
      - "**/*.gif"
      - ".github/workflows/deploy-learning-site.yml"
  pull_request:
    paths:
      - "learning-site/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.PNG"
      - "**/*.gif"
      - ".github/workflows/deploy-learning-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: learning-site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Content pipeline (every note mapped, anchors resolve, partition, counts)
        run: npm run content

      - name: Unit tests (trace generators and pipeline)
        run: npm test

      # C# runner: the .NET SDK compiles the in-browser runner and decides which C# blocks are runnable
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: C# runner unit tests (runnable-block detection, program shapes, limits)
        working-directory: learning-site/runner
        run: dotnet test --project Runner.Tests/Runner.Tests.csproj -c Release

      - name: Build the C# runner (.NET WebAssembly + Roslyn bundle)
        run: npx tsx scripts/runner/publish.ts

      - name: Runnable-block check (compile and run every runnable C# block, record expected output)
        run: npm run runner:check
        env:
          LY_REQUIRE_RUNNER: "1"

      - name: Build (Astro + Pagefind + output verification)
        run: npm run build
        env:
          LY_REQUIRE_RUNNER: "1"

      - name: Personal-data scan of the built site (report only; review personal-data-report.md)
        run: npm run scan:personal

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (every lesson page, visualizers mount, no console errors)
        run: npm run test:e2e

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            learning-site/coverage-report.md
            learning-site/runnable-report.md
            learning-site/personal-data-report.md
          if-no-files-found: ignore

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: learning-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
