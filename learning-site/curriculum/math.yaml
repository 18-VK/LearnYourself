        title: "Level 3: Intermediate (Algorithms & Real Systems)"
        kind: checklist
        sources:
          - file: "Competitive Programming/math-for-programming-roadmap.md"
            from: "## Level 3: Intermediate (Algorithms & Real Systems)"
            until: "## Level 4: Upper-Intermediate (Interview & Engineering Depth)"
        related: [dsa/roadmap/dsa-roadmap, dsa/sorting/sorting-summary]

  - id: level-4
    title: "Level 4: Upper-intermediate"
    lessons:
