  - title: Which sort to use
    table:
      columns: [Situation, Use]
      from: { lesson: sorting-summary, section: 'When to Use What (LeetCode Context)' }
      rows:
        - ['Default, "just sort it"', '`Array.Sort()` / `list.Sort()`: introsort, O(n log n) worst case, in place']
        - ['Need stability (keep the order of equal elements)', 'Merge sort, or LINQ `OrderBy()` (stable); `Array.Sort()` is not guaranteed stable']
        - ['Small known integer range (e.g. 0–100)', 'Counting sort']
        - ['Nearly sorted data or very small n (< 20)', 'Insertion sort']
        - ['Guaranteed worst case with O(1) space', 'Heap sort']
        - ['Fixed-width large integers, huge n', 'Radix sort']
        - ['Whiteboard: write a sort from memory', 'Quick sort or merge sort']

  - title: Sorting facts worth remembering
    items:
      - term: 'Stable sort'
        desc: 'Keeps the original relative order of elements that compare equal: matters when sorting records by one field.'
        from: { lesson: stability-and-simple-sorts, section: 'Quick concept: What does "stable" mean?' }
      - term: '`Array.Sort()` is introsort'
        desc: 'Quicksort that falls back to heapsort when recursion gets too deep, with insertion sort for small partitions.'
        from: { lesson: merge-and-quick-sort, section: '5. Quick Sort' }
      - term: 'Quicksort worst case'
        desc: 'A sorted (or reverse-sorted) array with a naive first/last pivot splits n−1 / 0 every time: n levels × O(n) = n(n−1)/2 = O(n²). A random or median-of-three pivot avoids it.'
        from: { lesson: merge-and-quick-sort, section: 'Why quicksort is O(n²) on a sorted array' }
      - term: 'Merge sort'
        desc: 'Guaranteed O(n log n) and stable, but O(n) extra space for arrays. Good for linked lists and external (on-disk) sorting; slower than quicksort in practice on arrays.'
        from: { lesson: merge-and-quick-sort, section: '4. Merge Sort' }
      - term: 'Heap sort'
        desc: 'O(n log n) with O(1) extra space, but poor cache locality makes it slower than quicksort in practice; not stable.'
        from: { lesson: heap-sort, section: '6. Heap Sort' }
      - term: 'Insertion sort'
        desc: 'Adaptive (O(n) on sorted input), stable and online; used inside hybrid sorts below ~16–32 elements.'
        from: { lesson: stability-and-simple-sorts, section: '3. Insertion Sort' }
      - term: 'Selection sort'
        desc: 'Always O(n²), but only O(n) swaps: useful when writes are expensive.'
        from: { lesson: stability-and-simple-sorts, section: '2. Selection Sort' }
      - term: 'Counting sort: stable or simple?'
        desc: 'Plain integers: the simple "count, then write back" version is fine. Objects by key with ties in original order: use the stable cumulative-count version.'
        from: { lesson: counting-radix-bucket, section: 'Rule of thumb' }
      - term: 'Radix sort'
        desc: 'Digit by digit from the least significant, with a stable counting sort per digit. The notes'' version needs a non-empty array of non-negative integers.'
        from: { lesson: counting-radix-bucket, section: '8. Radix Sort' }
      - term: 'Bucket sort'
        desc: 'Near-linear on uniformly distributed input over a known range (the notes'' version assumes [0, 1)); degrades to O(n²) when values cluster in one bucket.'
        from: { lesson: counting-radix-bucket, section: '9. Bucket Sort' }
      - term: '`List<T>.Sort(Comparison<T>)`'
        desc: 'Sorts with a custom comparison delegate; uses `Array.Sort` (introsort), is unstable and O(n log n).'
        docs: { url: 'https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.list-1.sort', title: 'List<T>.Sort Method (System.Collections.Generic)', accessed: '2026-10-22' }

