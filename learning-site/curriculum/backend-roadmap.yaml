          "### 9. Application Server (your home turf — go deeper, not wider)": [phase-2/pipeline/middleware, phase-2/controllers-and-routing/model-binding, phase-2/pipeline/global-exception-handling]
          "### 10. Cache (Redis)": [backend-roadmap/caching]
          "### 11. Database (PostgreSQL / your SQL Server experience)": [sql-server/indexes-and-performance/execution-plans-and-sargability, sql-server/transactions/transactions-and-concurrency]
          "### 12. Message Queue (Kafka / RabbitMQ)": [backend-roadmap/message-queues]
          "### 13. Response path back to client": [phase-2/controllers-and-routing/return-types]
          "### Foundations (you have these — keep sharp)": [dsa/roadmap/dsa-roadmap, phase-2/architecture/solid]
