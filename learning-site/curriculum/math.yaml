# Math for Programming
# Source: Competitive Programming/math-for-programming-roadmap.md (roadmap only; no lesson content).
#
# Why a separate course and not a DSA track: the roadmap is large (6 levels, ~196 checkboxes), has its
# own learning paths and resources, and levels 5–6 (calculus, ML math, cryptography, research topics)
# go well beyond DSA. Keeping it separate keeps the DSA course about implemented algorithms. The two
# cross-link: DSA's roadmap links to the math levels, and math topics link to DSA lessons where they exist.

id: math
title: "Math for Programming"
shortTitle: "Math"
kind: roadmap
accent: emerald
icon: sigma
prerequisites: []
summary: >-
  A roadmap of the math a programmer uses, from number systems and logic to probability, linear
  algebra and specialisation topics. Each level is a checklist that saves your progress.

landing:
  sources:
    - file: "Competitive Programming/math-for-programming-roadmap.md"
      until: "## Level 1: Foundations (Beginner)"
      reason: "Title and 'how to use this' guidance; shown on the course landing page."

modules:
  - id: level-1
    title: "Level 1: Foundations"
    lessons:
      - id: foundations
        title: "Level 1: Foundations (Beginner)"
        kind: checklist
        sources:
          - file: "Competitive Programming/math-for-programming-roadmap.md"
            from: "## Level 1: Foundations (Beginner)"
            until: "## Level 2: Core Programming Math (Easy to Intermediate)"
        related: [phase-1/language-basics/operators]

  - id: level-2
    title: "Level 2: Core programming math"
    lessons:
