          "## Stage 1 — How the Internet Actually Works": [phase-2/foundations/rest-and-http-basics, phase-2/foundations/http-headers, backend-roadmap/how-requests-travel]
          "## Stage 2 — Building Your First Backend": [phase-2/foundations/aspnet-core-overview, phase-2/controllers-and-routing/controllers]
          "## Stage 3 — Databases": [sql-server/setup-and-security/server-database-schema, phase-1/ef-core/ef-core-basics]
          "## Stage 4 — The Request Lifecycle (your diagram)": [phase-2/pipeline/middleware, backend-roadmap/roadmaps/request-to-response]
          "## Stage 5 — Authentication & Security": [phase-2/auth-fundamentals/authn-and-authz-basics, phase-2/pipeline/https-and-hsts, backend-roadmap/security-beyond-basics]
          "## Stage 6 — APIs Beyond Basic REST": [phase-2/production-concerns/api-versioning, backend-roadmap/apis-and-protocols]
          "## Stage 7 — Testing": [backend-roadmap/testing]
          "## Stage 8 — Architecture & Design": [phase-2/architecture/solid, phase-2/architecture/clean-architecture, backend-roadmap/architecture-at-scale]
          "## Stage 9 — DevOps & Deployment": [backend-roadmap/devops-and-infrastructure]
          "## Stage 10 — System Design (once comfortable with everything above)": [backend-roadmap/system-design]

