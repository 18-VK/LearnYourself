    title: "Foundations: ASP.NET Core, REST & HTTP"
    lessons:
      - id: aspnet-core-overview
        title: "ASP.NET Core overview, Web API vs MVC & minimal APIs"
        sources:
          - file: "Phase2-ASP.NetAndBackend/ASP.Net Core/1.ASP_overview.md"
        place:
          - diagram: aspnet-architecture
            tier: 1
            at: { section: "## ASP .Net Architecture", codeBlock: 1 }
          - diagram: middleware-request-order
            tier: 1
            at: { section: "### 3. Middleware", codeBlock: 1 }
          - diagram: middleware-response-order
            tier: 1
            at: { section: "### 6. Response Passes Through Middleware", codeBlock: 1 }
          - diagram: web-api-architecture
            tier: 1
            at: { section: "## What is ASP.NET Core Web API?", codeBlock: 1 }
          - diagram: mvc-request-flow
            tier: 1
            at: { section: "## What is ASP.NET Core MVC?", codeBlock: 1 }
          - diagram: web-api-example
            tier: 1
            at: { section: "## When to Use Web API", codeBlock: 1 }
          - diagram: mvc-example
            tier: 1
            at: { section: "## When to Use MVC", codeBlock: 1 }
          - diagram: web-api-popular
            tier: 1
            at: { section: "## Why Web API is More Popular Today", codeBlock: 1 }

      - id: rest-and-http-basics
        title: "REST, HTTP methods & status codes"
        sources:
          - file: "Phase2-ASP.NetAndBackend/ASP.Net Core/2.RestAPI_N_HTTPBasics.md"
        cheatsheets: [http]

      - id: http-headers
        title: "HTTP headers in REST APIs"
        reason: "Unnumbered HTTP reference; follows HTTP basics by topic."
        sources:
          - file: "Phase2-ASP.NetAndBackend/ASP.Net Core/http-headers-rest-api.md"
        cheatsheets: [http]

  - id: controllers-and-routing
