# Every binary file in the repo, with authorship and how the public site may use it.
# Decided 2026-10-21:
#   - Your own files: view on the website only. PDFs in an embedded viewer, DOCX converted at build time
#     into read-only pages, no download links.
#   - Third-party files: shown view-only and credited to their visible author or source.
# `publish: true` + `mode: view` means "show it, never offer a download link". A public static site cannot
# stop a determined visitor from saving what they can view; this only removes the download affordance.
# Only publish: true files are copied (with URL-safe names); CI fails if any other binary reaches the output.

