        - ['"Shortest path in grid / unweighted graph"', 'BFS']
        - ['"Find any path / explore all combinations"', 'DFS / backtracking']
        - ['Tiny arrays or a single query', 'Linear search is fine']

  - title: Built-in C# search methods
    table:
      columns: [Method, Requires sorted?, Complexity, Notes]
      from: { lesson: search-built-ins-and-summary, section: 'Built-in C# Search Methods' }
      rows:
