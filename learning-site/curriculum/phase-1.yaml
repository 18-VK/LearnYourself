    title: "Getting started with .NET"
    lessons:
      - id: what-is-dotnet
        title: "What is .NET? Framework, .NET Core, CLR & JIT"
        reason: "Repo-root intro note; read before folder 1."
        sources:
          - file: "Intro.txt"
        related: [phase-2/foundations/aspnet-core-overview]

      - id: project-types
        title: "C# and .NET project types"
        reason: "Two repo-root notes on the same topic: Visual Studio templates (.md) and CLI commands per template (.txt). Merged; both kept in full."
        sources:
          - file: "Type of CSharp projects.md"
          - file: "DotNet_ProjectTypes.txt"

      - id: dotnet-cli
        title: "The .NET CLI"
        reason: >-
          Tooling used from the first lesson, so placed here rather than in folder 15. Uses the fenced copy in
          15.C#_AdvanceTopics/; the Phase 1 root copy is the same content without code fences (see duplicates in
          _site.yaml). Note.md (running a .cs file without a project) is appended because it is the same topic.
