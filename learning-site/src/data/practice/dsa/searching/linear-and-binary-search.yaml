# "Try it yourself" for dsa/searching/linear-and-binary-search. Reviewed cases: the note's own example in
# “3. Lower Bound / Upper Bound” (arr = [1, 2, 2, 2, 3], target = 2: LowerBound = 1, UpperBound = 4). The other cases
# are generated; the searches use arrays without duplicates, where only one index is correct.
exercises:
  - id: linear-search
    title: "Write LinearSearch"
    task: "Return the index of the first element equal to target, or -1 if there is none."
    solution: { block: 1, startsWith: "int LinearSearch(int[] arr, int target)" }
    call: "LinearSearch(arr, target)"
    cases:
      - given: { arr: [1, 2, 2, 2, 3], target: 2 }
        expected: 1
        reviewed: false
        source: "Input from the note's example in “3. Lower Bound / Upper Bound”; expected: the first index, which the note gives as 1 there"
      - given: { arr: [4, 2, 7, 1], target: 7 }
        expected: 2
        reviewed: false
        source: "Generated: unsorted input"
      - given: { arr: [4, 2, 7, 1], target: 5 }
        expected: -1
        reviewed: false
        source: "Generated: not found"
      - given: { arr: [], target: 1 }
        expected: -1
        reviewed: false
        source: "Generated: an empty array"
  - id: binary-search
    title: "Write BinarySearch (iterative)"
    task: "arr is sorted: return the index of target, or -1, halving the search range each step."
    solution: { block: 2, startsWith: "int BinarySearch(int[] arr, int target)" }
    call: "BinarySearch(arr, target)"
    cases: &binary
      - given: { arr: [1, 3, 5, 7, 9, 11], target: 7 }
        expected: 3
        reviewed: false
        source: "Generated"
      - given: { arr: [1, 3, 5, 7, 9, 11], target: 1 }
        expected: 0
        reviewed: false
        source: "Generated: the first element"
      - given: { arr: [1, 3, 5, 7, 9, 11], target: 11 }
        expected: 5
        reviewed: false
        source: "Generated: the last element"
      - given: { arr: [1, 3, 5, 7, 9, 11], target: 4 }
        expected: -1
        reviewed: false
        source: "Generated: not found"
      - given: { arr: [], target: 3 }
        expected: -1
        reviewed: false
        source: "Generated: an empty array"
  - id: binary-search-recursive
    title: "Write BinarySearchRec (recursive)"
    task: "The recursive version: search arr[left..right] for target and return its index, or -1."
    solution: { block: 3, startsWith: "int BinarySearchRec(int[] arr, int target, int left, int right)" }
    call: "BinarySearchRec(arr, target, 0, arr.Length - 1)"
    cases: *binary
  - id: lower-upper-bound
    title: "Write LowerBound and UpperBound"
    task: "LowerBound: the first index with arr[i] >= target. UpperBound: the first index with arr[i] > target. arr is sorted."
    solution: { block: 4, startsWith: "int LowerBound(int[] arr, int target)" }
    call: "LowerBound(arr, target)"
    cases:
      - given: { arr: [1, 2, 2, 2, 3], target: 2 }
        expected: 1
        reviewed: true
        quote: "LowerBound = 1, UpperBound = 4"
        source: "The note's example in “3. Lower Bound / Upper Bound”: LowerBound = 1"
      - given: { arr: [1, 2, 2, 2, 3], target: 2 }
        call: "UpperBound(arr, target)"
        expected: 4
        reviewed: true
        quote: "LowerBound = 1, UpperBound = 4"
        source: "The note's example in “3. Lower Bound / Upper Bound”: UpperBound = 4"
      - given: { arr: [1, 2, 2, 2, 3], target: 0 }
        expected: 0
        reviewed: false
        source: "Generated: smaller than everything"
      - given: { arr: [1, 2, 2, 2, 3], target: 4 }
        call: "UpperBound(arr, target)"
        expected: 5
        reviewed: false
        source: "Generated: larger than everything"
      - given: { arr: [], target: 1 }
        expected: 0
        reviewed: false
        source: "Generated: an empty array"
