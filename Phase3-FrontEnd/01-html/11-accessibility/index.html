<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · Accessibility demo</title>
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #4a4a4a;
      --surface: #ffffff;
      --accent: #0b57d0;      /* 6.6:1 on white */
      --error: #b3261e;       /* 6.5:1 on white */
      --success: #146c2e;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
    }
    body { margin: 0; }
    header, main, footer { padding: 1rem; max-width: 40rem; margin: 0 auto; }
    nav ul { display: flex; gap: 1rem; padding: 0; list-style: none; }
    a { color: var(--accent); }

    /* Skip link: off screen until it receives keyboard focus */
    .skip-link {
      position: absolute;
      left: 1rem;
      top: -10rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #fff;
      z-index: 1;
    }
    .skip-link:focus { top: 1rem; }

    /* One visible focus style for everything; outline survives forced-colours mode */
    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .field { margin-block: 1.25rem; }
    label { display: block; font-weight: 600; }
    .hint { margin: 0.25rem 0; color: var(--muted); }
    input {
      font: inherit;
      padding: 0.5rem;
      width: 100%;
      max-width: 24rem;
      box-sizing: border-box;
      border: 2px solid var(--muted);   /* 3:1+ boundary contrast (WCAG 1.4.11) */
      border-radius: 4px;
    }
    input[aria-invalid="true"] { border-color: var(--error); border-width: 3px; }
    .error { margin: 0.25rem 0; color: var(--error); font-weight: 600; }
    .error::before { content: "Error: "; }   /* not colour alone */

    button {
      font: inherit;
      min-height: 44px;                    /* comfortably above the 24px minimum */
      padding: 0.5rem 1.25rem;
      border: 2px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--accent); }

    .error-summary {
      border: 4px solid var(--error);
      padding: 0.5rem 1rem;
      margin-block: 1rem;
    }
    .error-summary h2 { margin-top: 0; font-size: 1.25rem; }
    .status { color: var(--success); font-weight: 600; }
  </style>
</head>
<body>
  <!-- 1. Skip link: the first focusable element on the page -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- 2. Landmarks: banner, navigation, main, contentinfo -->
  <header>
    <p><strong>Demo Shop</strong></p>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#" aria-current="page">Account</a></li>
        <li><a href="#">Orders</a></li>
        <li><a href="#">Help</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Create an account</h1>
    <p>All fields are required.</p>

    <!-- 3. Error summary: hidden until a failed submit, then receives focus -->
    <div id="error-summary" class="error-summary" tabindex="-1" hidden>
      <h2>There is a problem</h2>
      <ul></ul>
    </div>

    <!-- novalidate: we render our own, accessible messages instead of browser bubbles -->
    <form id="signup" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name"
               aria-describedby="name-error" required>
        <p id="name-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <p id="email-hint" class="hint">We only use it to send your receipt.</p>
        <input id="email" name="email" type="email" autocomplete="email"
               aria-describedby="email-hint email-error" required>
        <p id="email-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <p id="password-hint" class="hint">At least 12 characters. You can paste from a password manager.</p>
        <input id="password" name="password" type="password" autocomplete="new-password"
               aria-describedby="password-hint password-error" required>
        <p id="password-error" class="error" hidden></p>
        <!-- 4. Toggle button: state exposed with aria-pressed, the label stays the same -->
        <button type="button" class="secondary" id="toggle-password"
                aria-pressed="false" aria-controls="password">Show password</button>
      </div>

      <button type="submit">Create account</button>
    </form>

    <!-- 5. Live region: present (and empty) from page load, so changes are announced -->
    <p id="form-status" class="status" role="status"></p>
  </main>

  <footer>
    <p><small>Accessibility demo for the study notes.</small></p>
  </footer>

  <script>
    const form = document.getElementById("signup");
    const summary = document.getElementById("error-summary");
    const status = document.getElementById("form-status");

    const checks = {
      name: (v) => (v.trim() ? "" : "Enter your full name"),
      email: (v) =>
        !v.trim() ? "Enter your email address"
        : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? ""
        : "Enter an email address in the format name@example.com",
      password: (v) => (v.length >= 12 ? "" : "Enter a password of at least 12 characters"),
    };

    function setError(input, message) {
      const error = document.getElementById(`${input.id}-error`);
      error.textContent = message;          // empty text = nothing read via aria-describedby
      error.hidden = !message;
      if (message) input.setAttribute("aria-invalid", "true");
      else input.removeAttribute("aria-invalid");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      status.textContent = "";

      const errors = [];
      for (const [name, check] of Object.entries(checks)) {
        const input = form.elements[name];
        const message = check(input.value);
        setError(input, message);
        if (message) errors.push({ input, message });
      }

      const list = summary.querySelector("ul");
      list.replaceChildren(
        ...errors.map(({ input, message }) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = `#${input.id}`;
          link.textContent = message;
          item.append(link);
          return item;
        })
      );
      summary.hidden = errors.length === 0;

      if (errors.length) {
        summary.focus();                    // screen readers read the summary; keyboard users start here
        return;
      }

      form.reset();
      status.textContent = "Account created. Check your inbox for a confirmation email.";
    });

    // Summary links: move focus into the field, not just scroll to it
    summary.addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if (!link) return;
      event.preventDefault();
      document.querySelector(link.getAttribute("href")).focus();
    });

    // Clear a field's error as soon as it becomes valid (validate on input only after an error exists)
    form.addEventListener("input", (event) => {
      const input = event.target;
      if (input.getAttribute("aria-invalid") === "true" && !checks[input.name](input.value)) {
        setError(input, "");
      }
    });

    const toggle = document.getElementById("toggle-password");
    toggle.addEventListener("click", () => {
      const showing = toggle.getAttribute("aria-pressed") === "true";
      toggle.setAttribute("aria-pressed", String(!showing));
      form.elements.password.type = showing ? "password" : "text";
    });
  </script>
</body>
</html>
