# Backend Developer Roadmap: a growing course
# Source today: BackendRoadmap/ (three roadmaps and one production checklist).
#
# This course is also the home for backend topic notes you add later. It has two parts:
#   1. `roadmaps`: the roadmap and checklist notes. Each roadmap renders as an interactive graph: headings
#      become nodes, the bullets under them become persistent checkboxes, and nodes link to lessons or to
#      the planned topic modules below.
#   2. Planned topic modules (`status: planned`), one per area your roadmaps name but no note covers yet.
#      They show as "coming soon" on the landing page and on roadmap nodes until they have lessons.
#      Their order follows "Suggested order given where you are" in backend-developer-roadmap.md, then
#      the remaining Part 2 areas in the note's order.
#
# Adding notes later:
#   - Put them in the module's `noteFolder` (create it), named N.Topic.md so they keep their order.
#   - Add a lesson entry under that module (id, title, sources) and drop `status: planned` once it has one.
#     Until a new note is mapped, the coverage check fails, names the file and prints a ready-to-paste
#     lesson entry, so a new note can never be silently left out.
#   - Notes outside these folders work too; they just need a lesson entry like any other note.

id: backend-roadmap
title: "Backend Developer Roadmap"
shortTitle: "Backend"
kind: course
accent: orange
icon: route
prerequisites: [phase-2]
summary: >-
  Three roadmaps (beginner to job-ready, request to response, database design) and a production-grade
  Web API checklist, with progress saved in your browser. Topic modules for caching, queues,
  observability, system design and more fill in as notes are added.

modules:
  - id: roadmaps
    title: "Roadmaps & checklist"
    lessons:
      - id: beginner-to-job-ready
        title: "Backend developer roadmap: beginner to job-ready"
        kind: roadmap
        sources:
