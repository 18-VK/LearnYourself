# Interview Prep (§10): topics, what the notes already provide, and web-research targets.
# Data lands in src/data/interview/<topic>.json (schema-validated) from Checkpoint 5.
# Order of work: notes first (origin: notes), then a ~20-question web pilot for aspnet-core, then review,
# then the remaining topics (origin: web, reviewed: false, with sources).

topics:
