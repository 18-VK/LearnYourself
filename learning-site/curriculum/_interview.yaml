    webTarget: 0   # notes only; no web research unless you ask

# Headings the "Interview" heuristic matches that are NOT interview material (excluded from collection):
falsePositives:
  - "Competitive Programming/dsa-roadmap.md › ## Level 3 — Advanced Interview Level (6–8 weeks)"
  - "Competitive Programming/math-for-programming-roadmap.md › ## Level 4: Upper-Intermediate (Interview & Engineering Depth)"

sourcing:
  preferred: ["learn.microsoft.com (C#, .NET, ASP.NET Core, EF Core, SQL Server)", "RFCs / IETF for HTTP, OAuth 2.0, JWT", "OWASP for security items"]
  rules:
    - "Answers in my own words; any quotation short and attributed."
    - "Each web question records sources: URL, title, date accessed."
    - "Version-dependent answers say so (.NET Framework vs .NET 8+, EF Core version, SQL Server version)."
    - "Conflicts with the notes are logged in CONTENT_ISSUES.md; the notes are not overridden."
    - "No paywalled or login-only sources."
