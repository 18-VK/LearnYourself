# Git & GitHub
# Source: Git-Github/ (added by the owner on 2026-10-24). The numbered notes are split at their own "##" sections; the
# unnumbered ones become one or two lessons each. 4.DailyScenarios.md was written for the site (see its header).
# The two "copy" files are a verified duplicate and an exclusion in _site.yaml.

id: git-github
title: "Git & GitHub"
shortTitle: "Git"
kind: course
accent: sky
icon: branch
prerequisites: []
summary: >-
  Version control as developers use it every day: what Git and GitHub are, the commands behind status, add,
  commit, diff and restore, a command reference for remotes, history, undo, branching, merge and rebase, safe
  force pushes and recovery, pull requests, and a set of daily scenarios with the commands that handle them.

modules:
  - id: foundations
    title: "Git and GitHub basics"
    lessons:
      - id: git-and-github
        title: "What Git and GitHub are"
        reason: "Git-Github.md is unnumbered; its first three sections introduce Git, GitHub and how they work together."
        sources:
          - file: "Git-Github/Git-Github.md"
            until: "## 4. Why Git configuration matters"
      - id: git-configuration-and-identity
        title: "Configuration and identity"
        reason: "Git-Github.md, sections 4–7: why config matters, identity, global vs local config, examples."
        sources:
          - file: "Git-Github/Git-Github.md"
            from: "## 4. Why Git configuration matters"
            until: "## 8. GitHub authentication"
      - id: git-github-authentication-and-ssh
        title: "GitHub authentication, SSH and the daily workflow"
        reason: "Git-Github.md, sections 8–12: authentication, SSH keys, the practical workflow, pager keys, summary."
        sources:
          - file: "Git-Github/Git-Github.md"
            from: "## 8. GitHub authentication"

