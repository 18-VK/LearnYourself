        - ['`list.Contains(x)` / `list.IndexOf(x)`', 'No', 'O(n)', 'Linear scan']
        - ['`Array.BinarySearch(arr, x)`', '**Yes**', 'O(log n)', 'Returns a **negative** value (`~insertionIndex`) if not found']
