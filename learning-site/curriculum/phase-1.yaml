# Phase 1 — C# & .NET Fundamentals
# Source: Phase1-CSharp_And_DotNet_core_fundamental/ folders 1–19, Phase 1 root notes, and repo-root intro notes.
# Folders 20–21 (WinForms/WPF, TaskFlow Studio) are the separate Desktop course.

id: phase-1
title: "Phase 1 — C# & .NET Fundamentals"
shortTitle: "Phase 1"
kind: course
accent: violet
icon: csharp
prerequisites: []
summary: >-
  The C# language and the .NET base libraries, in the order the notes were studied: syntax and types,
  OOP, collections, exceptions, async and threads, JSON/XML, LINQ, EF Core, Dapper and logging.

landing:
  sources:
    - file: "Phase1-CSharp_And_DotNet_core_fundamental/Musthave.md"
      reason: "A list of must-have topic headings with no body text; shown as the course's 'must-have topics' panel."

