# Phase 2 — ASP.NET Core Web API
# Source: Phase2-ASP.NetAndBackend/ASP.Net Core/ (numbered 1–16 plus unnumbered notes) and Examples/.

id: phase-2
title: "Phase 2 — ASP.NET Core Web API"
shortTitle: "Phase 2"
kind: course
accent: indigo
icon: server
prerequisites: [phase-1, sql-server]
summary: >-
  Building Web APIs with ASP.NET Core: REST and HTTP, controllers and routing, model binding and
  validation, HttpClient, middleware and error handling, authentication and auth servers, rate
  limiting, versioning and Clean Architecture, ending with the Task Management API capstone.

modules:
